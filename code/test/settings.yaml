data:
  batch_size_testing: 2
  batch_size_training: 2
  dir: /projects/ddu_net_heat_plume_prediction/HeatPlumePredictionWithCNNs/data/dataset_giant_square_100hp_varyK_1000dp
    inputs_pki outputs_t/
  n_inputs: 3
  n_outputs: 1
